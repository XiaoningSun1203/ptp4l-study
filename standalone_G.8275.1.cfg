#
# Telecom G.8275.1 T-TSC example configuration containing those attributes
# which either differ from the defaults or are relevant to the profile.
#
[global]
domainNumber	24

clientOnly      1
masterOnly	0

# Announce messages
announceReceiptTimeout	3
logAnnounceInterval	-3

# Sync/Delay_Req/Delay_Resp messages – 16 packets-per-second, -4 = 16 PPS
logSyncInterval		-4
logMinDelayReqInterval	-4

#when fault detect, delay 2^1=2s
fault_reset_interval     1
#
# step_window is in units of sync packets
#
# 3 seconds:
#   @ 16 PPS, set to 48
#   @ 1  PPS, set to  3
#only ptp3.1 is available
step_window	48

clockClass	255
clockAccuracy	0xFE
clock_class_threshold 7
timeSource	0xa0
maxStepsRemoved	255

offsetScaledLogVariance	0xffff

G.8275.defaultDS.localPriority	128
G.8275.portDS.localPriority	128

priority1	128
priority2	255

dataset_comparison	G.8275.x
transportSpecific	0

clock_type	OC
delay_mechanism	E2E


first_step_threshold	0.000020000
step_threshold		0.000000660
tx_timestamp_timeout	1000
#for idtcm, max 244000 ppb
max_frequency           244000
#sanity_freq_limit       0

write_phase_mode	1
servo_offset_threshold	580
servo_num_offset_values	256
tsproc_mode	raw
#delay_filter            moving_median
#delay_filter_length     50

network_transport	L2
#inhibit_announce    1

# 01:1B:19:00:00:00	Forwardable multi-cast address
# 01:80:C2:00:00:0E 	Non-forwardable multi-cast address
ptp_dst_mac		01:1B:19:00:00:00

# Added by system
delay_filter	moving_median

# Added by system
delay_filter_length	50
